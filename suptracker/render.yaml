# Render blueprint (https://render.com/docs/blueprint-spec). Other Docker hosts
# (Fly.io, Railway, Cloud Run, a VPS) work the same way: build the Dockerfile,
# mount a persistent volume at /data, expose $PORT.
services:
  - type: web
    name: suptracker-sies
    runtime: docker
    rootDir: suptracker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: SUPTRACKER_AUTOBUILD
        value: "1"
