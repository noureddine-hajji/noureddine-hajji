name: suptracker
# Sprint 10: one run per change. A push to a pull-request branch used to run the suite twice (push + pull_request);
# branches are now tested through their pull request, and main on push. A newer push cancels the older run.
on:
  push:
    branches: [main]
    paths: ["suptracker/**", ".github/workflows/suptracker.yml"]
  pull_request:
    paths: ["suptracker/**", ".github/workflows/suptracker.yml"]
concurrency:
  group: suptracker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# CI speed-up (after PR #41 took 56 min in one job): the test files are split over 3 runners by their measured
# duration (tests/conftest.py --shard, tests/durations.json; tests/test_shards.py checks each file runs exactly once),
# the timed red teams get a runner of their own, and the "test" job reports all of them under the old check name.
jobs:
  shard:
    name: shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suptracker/requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      # the red teams are independent: one worker per core, a test file per worker; the synthetic warehouse is built
      # once per set of inputs and shared (tests/synthetic.py cached_build). Red teams that MEASURE TIME
      # (analytics R16, Plan B B11, search R12) run in the "timed" job, never next to busy workers.
      - run: python -m pytest -q -n auto --dist loadfile --ignore=tests/test_analytics.py --ignore=tests/test_planb.py --ignore=tests/test_search.py --shard=${{ matrix.shard }}/3
  timed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suptracker/requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python -m pytest -q tests/test_analytics.py tests/test_planb.py tests/test_search.py
  test:
    # the check name the repository already knows: green only when every shard and the timed job are green
    if: always()
    needs: [shard, timed]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.shard.result }}" = success && test "${{ needs.timed.result }}" = success
