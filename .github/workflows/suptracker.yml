name: suptracker
# Sprint 10: one run per change. A push to a pull-request branch used to run the suite twice (push + pull_request);
# branches are now tested through their pull request, and main on push. A newer push cancels the older run.
on:
  push:
    branches: [main]
    paths: ["suptracker/**", ".github/workflows/suptracker.yml"]
  pull_request:
    paths: ["suptracker/**", ".github/workflows/suptracker.yml"]
concurrency:
  group: suptracker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suptracker/requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      # the red teams are independent: one worker per core, a test file per worker. Red teams that MEASURE TIME
      # (analytics R16, Plan B B11, search R12) run alone afterwards, never next to busy workers.
      - run: python -m pytest -q -n auto --dist loadfile --ignore=tests/test_analytics.py --ignore=tests/test_planb.py --ignore=tests/test_search.py
      - run: python -m pytest -q tests/test_analytics.py tests/test_planb.py tests/test_search.py
