name: suptracker
on:
  push:
    paths: ["suptracker/**", ".github/workflows/suptracker.yml"]
  pull_request:
    paths: ["suptracker/**", ".github/workflows/suptracker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
