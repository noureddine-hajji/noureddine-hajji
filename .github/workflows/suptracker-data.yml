# Builds the SupCompass warehouse from the official SIES exports on a GitHub runner
# and commits it (suptracker/data/suptracker.duckdb + verification report) to the
# branch it runs on. Vercel redeploys on that push and serves the file read-only.
name: suptracker-data
on:
  workflow_dispatch:
    inputs:
      probe_page:
        description: "Probe mode: HTML page whose linked files are downloaded and committed to data/probe/ (no warehouse build)"
        required: false
        default: ""
      probe_pattern:
        description: "Probe mode: regex matched against each link"
        required: false
        default: "\\.(xlsx|xls|csv|ods)(\\?|$)"
  schedule:
    # weekly (Mondays): the 2027 cartographie (mid-December) and the SIES 2026 campaign (early 2027) reach the site within a
    # week; an unchanged rebuild commits nothing (fingerprint below)
    - cron: "17 3 * * 1"
  # Campaign 2027 readiness: the daily live harvest commits new report PDFs to main; rebuild then, so they reach the site
  # the same day (a push made with the workflow token never triggers another workflow, a completed run does).
  workflow_run:
    workflows: [suptracker-rapports]
    types: [completed]
    branches: [main]          # the daily schedule; a claude/ branch's harvest is rebuilt there by hand
permissions:
  contents: write
concurrency:
  group: suptracker-data
  cancel-in-progress: false
jobs:
  # Brings a new official source into the repository for inspection before an ingestion is
  # designed (the SIES hosts are blocked in the development sandbox).
  probe:
    if: inputs.probe_page != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Download linked files
        env:
          PAGE: ${{ inputs.probe_page }}
          PATTERN: ${{ inputs.probe_pattern }}
        run: python scripts/probe_source.py "$PAGE" "$PATTERN" data/probe
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Probe source files ($(date -u +%Y-%m-%d))"
          git push
  # After a harvest run: rebuild only when it committed new reports (the harvest files differ from those of the last
  # published warehouse, data/harvest_fingerprint.txt); a closed site writes nothing and costs no build.
  harvest-changed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.fp.outputs.changed }}
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - id: fp
        run: |
          fp=$(git ls-files -s -- data/rapports/harvest | sha256sum | cut -d' ' -f1)
          if [ -f data/harvest_fingerprint.txt ] && [ "$(cat data/harvest_fingerprint.txt)" = "$fp" ]; then
            echo "no new report since the last published warehouse"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  build-data:
    needs: [harvest-changed]
    if: >-
      always() && (inputs.probe_page == '' || inputs.probe_page == null) &&
      (github.event_name != 'workflow_run' || needs.harvest-changed.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt
      - name: Ingest SIES Parquet exports
        run: python -m suptracker.ingest --force
      - name: Build warehouse
        run: python -m suptracker.build
      # --strict: a FAIL report stops the job before the commit step, so a warehouse that
      # breaks an SIES identity is never published (the report is still uploaded below).
      - name: Verify against SIES accounting identities
        run: python scripts/verify_ground_truth.py --out data/verification --live 10 --strict
      # Persona calibration of the profile -> programme journey (Maths + SES, mention AB)
      - name: Verify the positioning journey on the reference persona
        run: python scripts/verify_persona.py --out data/verification --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            suptracker/data/verification/
            suptracker/data/raw/manifest.json
          if-no-files-found: warn
      - name: Check warehouse size
        run: |
          ls -la data/
          size=$(stat -c %s data/suptracker.duckdb)
          echo "warehouse: $size bytes"
          test "$size" -lt 95000000 || { echo "::error::warehouse exceeds GitHub's 100 MB file limit"; exit 1; }
          tsize=$(stat -c %s data/rapport_textes.duckdb)
          echo "report texts: $tsize bytes"
          test "$tsize" -lt 95000000 || { echo "::error::report texts exceed GitHub's 100 MB file limit"; exit 1; }
      - name: Commit warehouse
        run: |
          # Commit only when the SIES inputs or the pipeline code changed: the warehouse
          # is a 40+ MB binary, and an identical rebuild must not grow the git history.
          # the harvested reports are an input too: without them, a day's new reports never reached the site
          fp=$( { jq -r '.[].sha256' data/raw/manifest.json | sort; \
                  git ls-files -s -- 'suptracker/*.py' scripts 'requirements*.txt' pyproject.toml data/sources data/rapports/harvest; } | sha256sum | cut -d' ' -f1 )
          if [ -f data/fingerprint.txt ] && [ "$(cat data/fingerprint.txt)" = "$fp" ]; then
            echo "SIES exports and pipeline unchanged since the last published warehouse"; exit 0
          fi
          echo "$fp" > data/fingerprint.txt
          git ls-files -s -- data/rapports/harvest | sha256sum | cut -d' ' -f1 > data/harvest_fingerprint.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/suptracker.duckdb data/rapport_textes.duckdb data/verification data/fingerprint.txt data/harvest_fingerprint.txt
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Refresh SIES warehouse ($(date -u +%Y-%m-%d))"
          git push
