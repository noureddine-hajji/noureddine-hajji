# Parcoursup public reports ("rapports publics"): per-formation doublette counts are published only in these PDFs.
# The Parcoursup, SIES and Internet Archive hosts are blocked in the development sandbox, so this runner fetches them.
#   mode "probe":   small samples to data/rapports/probe/ (design material)
#   mode "repair":  the files left unread, tried again on every other capture of their URL, rebuilt by qpdf if needed
#   mode "live":    the reports linked from the LIVE fiches (scripts/rapports_live.py); the daily schedule runs it: while the
#                   fiches are closed (between campaigns) it stops after three fiches, once they open it collects and resumes
#   mode "harvest": every report PDF archived by the Internet Archive, parsed into CSVs in data/rapports/harvest/
#                   (resumable: each run stops after `budget` minutes and commits; push request.json again to continue)
#   mode "grilles": the evaluation grids (field weights, criteria and importance) and the expected skills printed on the
#                   LIVE fiches (scripts/fiches_grilles.py) into data/fiches/; resumable, each fiche read again after 20 days
#   mode "quotidien" (the daily schedule): "live" (150 min at most), then "grilles" (140 min: a slow fiche can overrun by ~30 min, the job stops at 355)
# Triggered by workflow_dispatch, or by a push of data/rapports/request.json on a claude/ branch (a new workflow can only be
# dispatched once it is on the default branch).
name: suptracker-rapports
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, harvest, repair, live, grilles, grilles_echantillon or quotidien"
        required: false
        default: "harvest"
  schedule:
    - cron: "17 4 * * *"        # daily, mode "quotidien" = live + grilles (schedules run on the default branch only)
  push:
    branches: ["claude/**"]
    paths: ["suptracker/data/rapports/request.json"]
permissions:
  contents: write
concurrency:
  group: suptracker-rapports
  cancel-in-progress: false
jobs:
  rapports:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: suptracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx "duckdb==2.0.0" pdfplumber pikepdf
      - name: Read the request
        id: req
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          r = json.load(open("data/rapports/request.json")) if os.path.exists("data/rapports/request.json") else {}
          mode = "${{ inputs.mode }}" or ("quotidien" if "${{ github.event_name }}" == "schedule" else r.get("mode", "harvest"))
          print(f"mode={mode}")
          print(f"sample={r.get('sample', 12)}")
          print(f"budget={150 if mode == 'quotidien' else r.get('budget_min', 300)}")
          print(f"budget_grilles={140 if mode == 'quotidien' else r.get('budget_min', 300)}")
          print(f"enumerate={'--enumerate' if r.get('enumerate') else ''}")
          EOF
      - name: Probe
        if: steps.req.outputs.mode == 'probe'
        run: python scripts/rapports_probe.py data/suptracker.duckdb data/rapports/probe "${{ steps.req.outputs.sample }}"
      - name: Harvest archived reports
        if: steps.req.outputs.mode == 'harvest'
        run: python scripts/rapports_harvest.py data/rapports/harvest "${{ steps.req.outputs.budget }}" ${{ steps.req.outputs.enumerate }}
      - name: Repair unread reports
        if: steps.req.outputs.mode == 'repair'
        run: python scripts/rapports_harvest.py data/rapports/harvest "${{ steps.req.outputs.budget }}" --repair
      - name: Collect reports from the live fiches
        if: steps.req.outputs.mode == 'live' || steps.req.outputs.mode == 'quotidien'
        run: python scripts/rapports_live.py data/suptracker.duckdb data/rapports/harvest data/rapports/live "${{ steps.req.outputs.budget }}"
      - name: Probe the live Parcoursup reports
        if: steps.req.outputs.mode == 'liveprobe'
        run: python scripts/rapports_live.py --probe data/rapports/live
      - name: Read the evaluation grids of the live fiches
        if: (steps.req.outputs.mode == 'grilles' || steps.req.outputs.mode == 'quotidien') && !cancelled()
        run: python scripts/fiches_grilles.py data/suptracker.duckdb data/fiches "${{ steps.req.outputs.budget_grilles }}"
      - name: Save masked samples of the fiches without a usable grid
        if: steps.req.outputs.mode == 'grilles_echantillon'
        run: python scripts/fiches_grilles.py --echantillon data/fiches
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rapports/probe data/rapports/harvest data/rapports/live data/fiches 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Parcoursup public reports: ${{ steps.req.outputs.mode }} ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
